name: SecDevOps

on: [push]

jobs:
    build-and-test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repo
              uses: actions/checkout@v3

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: '3.10'

            - name: Create reports directory
              run: mkdir -p reports

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt

            - name: Run unit tests
              run: |
                  pytest

            - name: Run Bandit security scan (JSON)
              run: bandit -r . -f json -o reports/bandit-report.json --skip B101

            - name: Run pip-audit and export JSON
              run: pip-audit -f json -o reports/pip-audit-report.json

            - name: Set up Docker
              uses: docker/setup-buildx-action@v3

            - name: Build Docker image
              run: docker build -t hello-secdevops:latest .

            - name: Docker Scout Scan
              uses: docker/scout-action@v1.0.9
              with:
                dockerhub-user: ${{ secrets.REPO_USER }}
                dockerhub-password: ${{ secrets.REPO_PWD }}
                command: quickview,cves
                only-severities: critical,high
                sarif-file: scout-report.sarif

            - name: Upload Artifact
              uses: actions/upload-artifact@v4
              if: always()
              with:
                name: docker-scout-findings
                path: scout-report.sarif

            - name: Upload Bandit report
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: bandit-report
                  path: reports/bandit-report.json

            - name: Upload pip-audit report
              uses: actions/upload-artifact@v4
              if: always()              
              with:
                  name: pip-audit-report
                  path: reports/pip-audit-report.json

            - name: Upload Docker Scout report
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: scout-report
                  path: reports/scout-report.json

