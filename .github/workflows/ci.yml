name: SecDevOps

on: [push]

jobs:
  full-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Create reports directory
        run: mkdir -p reports

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: pytest

      - name: Bandit scan
        run: bandit -r . -f json -o reports/bandit-report.json --skip B101

      - name: pip-audit
        run: pip-audit -f json -o reports/pip-audit-report.json

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t hello-secdevops:latest .

      - name: Docker Scout Scan
        run: |
            curl -fsSL https://raw.githubusercontent.com/docker/scout-cli/main/install.sh -o install-scout.sh
            sh install-scout.sh
            echo ${{ secrets.REPO_PWD }} | docker login -u ${{ secrets.REPO_USER }} --password-stdin
            docker scout quickview
            docker scout cves

      - name: Upload Docker Scout report
        uses: actions/upload-artifact@v4
        with:
          name: docker-scout-report
          path: scout-report.sarif

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: reports/bandit-report.json

      - name: Upload pip-audit report
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: reports/pip-audit-report.json
